<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juniper notes</title><style>body{margin:0;background:#f4efd9;color:#172c29;font:18px system-ui}main{max-width:640px;margin:60px auto;padding:32px}button{font:inherit;background:#e9a389;color:#172c29;padding:14px 24px;border:0;border-radius:20px;cursor:pointer}button:focus-visible{outline:3px solid #172c29;outline-offset:4px}.details{background:linear-gradient(110deg,#d8dec0,#f1d3ad);padding:24px;border-radius:24px;margin-top:24px;opacity:0;transform:translateY(30px);transition:all 1.2s}.details.open{opacity:1;transform:translateY(0)}.details[hidden]{display:none}</style><main><h1>Juniper notes</h1><p>A small workspace for collecting ideas.</p><button id="toggle" aria-expanded="false" aria-controls="details">Show notebook details</button><section id="details" class="details" hidden><h2>Notebook details</h2><p>Seven notes, gathered this week.</p><button id="close">Close details</button></section></main><script>const toggle=document.getElementById('toggle'),details=document.getElementById('details');toggle.onclick=()=>{details.hidden=false;requestAnimationFrame(()=>details.classList.add('open'));setTimeout(()=>{toggle.setAttribute('aria-expanded','true');document.getElementById('close').focus()},1200)};document.getElementById('close').onclick=()=>{details.classList.remove('open');setTimeout(()=>{details.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus()},1200)};</script></html>
